<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Suivi des plans de paiement</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paiements">
<meta name="theme-color" content="#12161d">
<style>
  :root{
    --bg:#12161d;
    --panel:#1c222c;
    --panel-2:#232a35;
    --border:#2b3340;
    --text:#f1efea;
    --text-dim:#8b93a3;
    --accent-paid:#4fa98a;
    --accent-owed:#e0a458;
    --accent-danger:#d9705f;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding-bottom:96px;}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}

  header{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg, var(--bg) 80%, transparent);
    padding-top:18px; padding-bottom:8px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-dim); margin:0 0 10px;
  }
  .totalcard{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
  }
  .totalcard .block{flex:1;}
  .totalcard .label{font-size:11px; color:var(--text-dim); margin-bottom:4px;}
  .totalcard .num{font-family:var(--mono); font-size:20px; font-variant-numeric:tabular-nums; font-weight:600;}
  .totalcard .num.owed{color:var(--accent-owed);}
  .totalcard .num.paid{color:var(--accent-paid);}
  .divider-v{width:1px; align-self:stretch; background:var(--border);}

  main{padding-top:18px;}
  .empty{
    text-align:center; color:var(--text-dim); padding:60px 20px; font-size:14px; line-height:1.6;
  }

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; margin-bottom:12px; position:relative;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px;}
  .card-name{font-size:16px; font-weight:600;}
  .card-meta{font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-top:2px;}
  .card-actions{display:flex; gap:6px;}
  .due-badge{
    display:inline-block; font-family:var(--mono); font-size:11px; padding:3px 8px;
    border-radius:999px; margin-top:6px; background:var(--panel-2); color:var(--text-dim);
    border:1px solid var(--border);
  }
  .due-badge.soon{color:var(--accent-owed); border-color:var(--accent-owed);}
  .due-badge.today{color:#0d1712; background:var(--accent-owed); border-color:var(--accent-owed);}
  .bell-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim); font-size:13px;
    padding:8px 10px; border-radius:10px; cursor:pointer;
  }
  .bell-btn:active{background:var(--panel-2);}
  .header-actions{display:flex; justify-content:flex-end; margin-top:8px;}
  .link-btn{
    background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline;
    cursor:pointer; padding:4px 0;
  }
  .icon-btn{
    background:none; border:none; color:var(--text-dim); font-size:16px; padding:4px 6px; cursor:pointer;
    border-radius:8px; line-height:1;
  }
  .icon-btn:active{background:var(--panel-2);}

  .amounts{
    display:flex; font-family:var(--mono); font-variant-numeric:tabular-nums;
    justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--text-dim);
  }
  .amounts b{color:var(--text); font-weight:600;}
  .amounts .rest{color:var(--accent-owed); font-weight:600;}

  .bar-track{height:8px; border-radius:5px; background:var(--panel-2); overflow:hidden; border:1px solid var(--border);}
  .bar-fill{height:100%; background:var(--accent-paid); border-radius:5px; transition:width .35s ease;}

  .card-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px;}
  .mensualite{font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .mensualite b{color:var(--text);}

  .btn{
    font-family:var(--sans); font-size:13px; font-weight:600; border:none; border-radius:10px;
    padding:9px 14px; cursor:pointer;
  }
  .btn-pay{background:var(--accent-paid); color:#0d1712;}
  .btn-pay:active{opacity:.85;}
  .btn-pay:disabled{background:var(--panel-2); color:var(--text-dim); cursor:default;}

  .fab{
    position:fixed; right:0; left:0; bottom:22px; display:flex; justify-content:center; z-index:10;
  }
  .fab button{
    font-family:var(--sans); font-weight:700; font-size:14px; letter-spacing:.02em;
    background:var(--text); color:var(--bg); border:none; border-radius:999px;
    padding:14px 26px; box-shadow:0 6px 20px rgba(0,0,0,.4); cursor:pointer;
  }
  .fab button:active{transform:scale(.97);}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:none;
    align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.show{display:flex;}
  .sheet{
    width:100%; max-width:520px; background:var(--panel); border-radius:18px 18px 0 0;
    padding:20px 18px 26px; border:1px solid var(--border); border-bottom:none;
    max-height:88vh; overflow-y:auto;
  }
  .sheet h2{margin:0 0 4px; font-size:17px;}
  .sheet .sub{color:var(--text-dim); font-size:12px; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px;}
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:15px; font-family:var(--sans);
  }
  .field input:focus{outline:none; border-color:var(--accent-paid);}
  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn-secondary{background:var(--panel-2); color:var(--text); flex:1; padding:12px;}
  .btn-primary{background:var(--accent-paid); color:#0d1712; flex:1; padding:12px;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:30;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .sched-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim); font-size:13px;
    padding:8px 10px; border-radius:10px; cursor:pointer;
  }
  .sched-btn:active{background:var(--panel-2);}
  .sched-row{
    display:flex; justify-content:space-between; align-items:center; font-family:var(--mono);
    font-size:13px; padding:10px 0; border-bottom:1px dashed var(--border);
  }
  .sched-row:last-child{border-bottom:none;}
  .sched-date{color:var(--text);}
  .sched-amount{font-variant-numeric:tabular-nums;}
  .sched-status{font-size:11px; padding:2px 8px; border-radius:999px;}
  .sched-status.paid{background:rgba(79,169,138,.15); color:var(--accent-paid);}
  .sched-status.upcoming{background:var(--panel-2); color:var(--text-dim);}
  .sched-close{
    width:100%; margin-top:16px; background:var(--panel-2); color:var(--text); border:none;
    border-radius:10px; padding:12px; font-size:13px; font-weight:600; cursor:pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Plans de paiement</p>
    <div class="totalcard">
      <div class="block">
        <div class="label">Restant à payer (global)</div>
        <div class="num owed" id="global-owed">—</div>
      </div>
      <div class="divider-v"></div>
      <div class="block" style="text-align:right;">
        <div class="label">Déjà payé</div>
        <div class="num paid" id="global-paid">—</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="link-btn" id="export-all">📅 Ajouter tous les rappels au Calendrier</button>
    </div>
  </header>

  <main id="main">
    <div class="empty" id="empty-state">Chargement…</div>
  </main>
</div>

<div class="fab">
  <button id="open-add">+ Ajouter un plan</button>
</div>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2 id="sheet-title">Nouveau plan de paiement</h2>
    <p class="sub">Ex: crédit, échelonnement, abonnement à rembourser…</p>

    <div class="field">
      <label>Nom du plan</label>
      <input type="text" id="f-name" placeholder="Ex: Prêt voiture, Facture Orange…">
    </div>
    <div class="field">
      <label>Montant total dû (€)</label>
      <input type="number" id="f-total" inputmode="decimal" placeholder="1200">
    </div>
    <div class="field">
      <label>Déjà payé jusqu'ici (€) — optionnel</label>
      <input type="number" id="f-paid" inputmode="decimal" placeholder="0">
    </div>
    <div class="field">
      <label>Paiement mensuel (€) — optionnel</label>
      <input type="number" id="f-monthly" inputmode="decimal" placeholder="100">
    </div>
    <div class="field">
      <label>Jour d'échéance dans le mois — optionnel</label>
      <input type="number" id="f-dueday" inputmode="numeric" min="1" max="31" placeholder="Ex: 5">
    </div>

    <div class="sheet-actions">
      <button class="btn btn-secondary" id="cancel-add">Annuler</button>
      <button class="btn btn-primary" id="save-add">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-backdrop" id="sched-backdrop">
  <div class="sheet">
    <h2 id="sched-title">Échéancier</h2>
    <p class="sub" id="sched-sub"></p>
    <div id="sched-list"></div>
    <button class="sched-close" id="sched-close">Fermer</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'payment-plans';
let plans = [];
let editingId = null;

const fmt = (n) => (n||0).toLocaleString('fr-BE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function loadPlans(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    plans = raw ? JSON.parse(raw) : [];
  }catch(e){
    plans = [];
  }
  render();
}

async function savePlans(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(plans));
  }catch(e){
    showToast("Erreur de sauvegarde — réessaie");
  }
}

function render(){
  const main = document.getElementById('main');
  const empty = document.getElementById('empty-state');

  let totalAll = 0, paidAll = 0;
  plans.forEach(p => { totalAll += Number(p.total)||0; paidAll += Number(p.paid)||0; });
  document.getElementById('global-owed').textContent = fmt(totalAll - paidAll);
  document.getElementById('global-paid').textContent = fmt(paidAll) + ' / ' + fmt(totalAll);

  main.innerHTML = '';
  if(plans.length === 0){
    main.innerHTML = '<div class="empty">Aucun plan de paiement pour l\'instant.<br>Touche « + Ajouter un plan » pour commencer.</div>';
    return;
  }

  plans.forEach(p => {
    const total = Number(p.total)||0;
    const paid = Math.min(Number(p.paid)||0, total);
    const rest = Math.max(total - paid, 0);
    const pct = total > 0 ? Math.min((paid/total)*100, 100) : 0;
    const done = rest <= 0;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${escapeHtml(p.name)}</div>
          <div class="card-meta">${p.history && p.history.length ? p.history.length + ' paiement(s) enregistré(s)' : 'Aucun paiement encore'}</div>
        </div>
        <div class="card-actions">
          <button class="icon-btn" data-edit="${p.id}" title="Modifier">✎</button>
          <button class="icon-btn" data-del="${p.id}" title="Supprimer">✕</button>
        </div>
      </div>
      ${p.dueDay ? dueBadge(p.dueDay) : ''}
      <div class="amounts" style="margin-top:${p.dueDay ? '10px' : '0'}">
        <span>Payé: <b>${fmt(paid)}</b></span>
        <span class="rest">Restant: ${fmt(rest)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="card-bottom">
        <div class="mensualite">${p.monthly ? 'Mensualité: <b>' + fmt(p.monthly) + '</b>' : 'Total: <b>' + fmt(total) + '</b>'}</div>
        <div style="display:flex; gap:8px;">
          <button class="sched-btn" data-sched="${p.id}" title="Voir l'échéancier">📋</button>
          <button class="bell-btn" data-remind="${p.id}" title="Ajouter un rappel au Calendrier">🔔</button>
          <button class="btn btn-pay" data-pay="${p.id}" ${done || !p.monthly ? 'disabled' : ''}>
            ${done ? 'Soldé ✓' : 'Payer ce mois'}
          </button>
        </div>
      </div>
    `;
    main.appendChild(card);
  });

  document.querySelectorAll('[data-pay]').forEach(b => b.addEventListener('click', onPay));
  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', onEdit));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', onDelete));
  document.querySelectorAll('[data-remind]').forEach(b => b.addEventListener('click', onReminder));
  document.querySelectorAll('[data-sched]').forEach(b => b.addEventListener('click', onSchedule));
}

function nextDueDate(dueDay){
  if(!dueDay) return null;
  const today = new Date();
  let y = today.getFullYear(), m = today.getMonth();
  let candidate = new Date(y, m, dueDay);
  if(candidate < new Date(today.getFullYear(), today.getMonth(), today.getDate())){
    candidate = new Date(y, m+1, dueDay);
  }
  return candidate;
}

function dueBadge(dueDay){
  if(!dueDay) return '';
  const d = nextDueDate(dueDay);
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((d - today) / 86400000);
  const dateLabel = d.toLocaleDateString('fr-BE', {day:'numeric', month:'short'});
  let cls = '', text = 'Prochain paiement: ' + dateLabel;
  if(diffDays === 0){ cls = 'today'; text = "Paiement prévu aujourd'hui"; }
  else if(diffDays === 1){ cls = 'soon'; text = 'Paiement prévu demain'; }
  else if(diffDays <= 5){ cls = 'soon'; text = 'Paiement dans ' + diffDays + ' j (' + dateLabel + ')'; }
  return `<span class="due-badge ${cls}">🔔 ${text}</span>`;
}

function pad(n){ return String(n).padStart(2,'0'); }

function icsDateTime(date, hour){
  return date.getFullYear() + pad(date.getMonth()+1) + pad(date.getDate()) + 'T' + pad(hour) + '0000';
}

function buildEvent(plan){
  const due = nextDueDate(plan.dueDay);
  if(!due) return '';
  const uid = plan.id + '@concierge-telecom-tracker';
  const dtstart = icsDateTime(due, 9);
  const dtend = icsDateTime(due, 9);
  const summary = 'Paiement: ' + plan.name + (plan.monthly ? ' (' + fmt(plan.monthly) + ')' : '');
  return [
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + icsDateTime(new Date(), 9),
    'DTSTART:' + dtstart,
    'DTEND:' + dtend,
    'RRULE:FREQ=MONTHLY;BYMONTHDAY=' + plan.dueDay,
    'SUMMARY:' + summary,
    'BEGIN:VALARM',
    'TRIGGER:-P1D',
    'ACTION:DISPLAY',
    'DESCRIPTION:Rappel — ' + summary + ' demain',
    'END:VALARM',
    'BEGIN:VALARM',
    'TRIGGER:PT0M',
    'ACTION:DISPLAY',
    'DESCRIPTION:' + summary,
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}

function downloadICS(content, filename){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function onReminder(e){
  const id = e.currentTarget.getAttribute('data-remind');
  const p = plans.find(x => x.id === id);
  if(!p || !p.dueDay){ showToast("Ajoute d'abord un jour d'échéance à ce plan"); return; }
  const event = buildEvent(p);
  const ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Concierge Telecom//Suivi Paiements//FR\r\nCALSCALE:GREGORIAN\r\n' + event + '\r\nEND:VCALENDAR';
  downloadICS(ics, p.name.replace(/[^a-z0-9]/gi,'_') + '_rappel.ics');
  showToast('Fichier rappel téléchargé — ouvre-le pour l\'ajouter au Calendrier');
}

document.getElementById('export-all').addEventListener('click', () => {
  const withDue = plans.filter(p => p.dueDay);
  if(withDue.length === 0){ showToast('Aucun plan avec une date d\'échéance pour le moment'); return; }
  const events = withDue.map(buildEvent).filter(Boolean).join('\r\n');
  const ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Concierge Telecom//Suivi Paiements//FR\r\nCALSCALE:GREGORIAN\r\n' + events + '\r\nEND:VCALENDAR';
  downloadICS(ics, 'rappels_paiements.ics');
  showToast('Fichier calendrier téléchargé — ouvre-le pour tout ajouter');
});

function addMonths(date, n){
  return new Date(date.getFullYear(), date.getMonth()+n, date.getDate());
}

function onSchedule(e){
  const id = e.currentTarget.getAttribute('data-sched');
  const p = plans.find(x => x.id === id);
  if(!p) return;

  const total = Number(p.total)||0;
  const paid = Math.min(Number(p.paid)||0, total);
  const rest = Math.max(total - paid, 0);
  const history = (p.history || []).slice().sort((a,b) => a.date.localeCompare(b.date));

  let rows = '';

  history.forEach(h => {
    const d = new Date(h.date + 'T00:00:00');
    rows += `<div class="sched-row">
      <span class="sched-date">${d.toLocaleDateString('fr-BE', {day:'numeric', month:'short', year:'numeric'})}</span>
      <span class="sched-amount">${fmt(h.amount)}</span>
      <span class="sched-status paid">payé</span>
    </div>`;
  });

  if(rest > 0 && p.monthly > 0){
    const count = Math.ceil(rest / p.monthly);
    const startDate = p.dueDay ? nextDueDate(p.dueDay) : null;
    for(let i = 0; i < count; i++){
      const amount = Math.min(p.monthly, rest - i*p.monthly);
      const dateLabel = startDate
        ? addMonths(startDate, i).toLocaleDateString('fr-BE', {day:'numeric', month:'short', year:'numeric'})
        : 'Mois ' + (i+1) + ' (pas de date fixée)';
      rows += `<div class="sched-row">
        <span class="sched-date">${dateLabel}</span>
        <span class="sched-amount">${fmt(amount)}</span>
        <span class="sched-status upcoming">à venir</span>
      </div>`;
    }
  } else if(rest > 0){
    rows += `<div class="sched-row"><span class="sched-date" style="color:var(--text-dim)">Ajoute une mensualité pour calculer les échéances futures</span></div>`;
  }

  if(rows === ''){
    rows = '<div class="sched-row"><span class="sched-date" style="color:var(--text-dim)">Aucune échéance pour l\'instant</span></div>';
  }

  document.getElementById('sched-title').textContent = p.name;
  document.getElementById('sched-sub').textContent = rest > 0
    ? 'Restant: ' + fmt(rest) + (p.monthly ? ' · ' + Math.ceil(rest/p.monthly) + ' mensualité(s) restante(s)' : '')
    : 'Plan entièrement soldé';
  document.getElementById('sched-list').innerHTML = rows;
  document.getElementById('sched-backdrop').classList.add('show');
}

document.getElementById('sched-close').addEventListener('click', () => {
  document.getElementById('sched-backdrop').classList.remove('show');
});
document.getElementById('sched-backdrop').addEventListener('click', (e) => {
  if(e.target.id === 'sched-backdrop') document.getElementById('sched-backdrop').classList.remove('show');
});

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function onPay(e){
  const id = e.currentTarget.getAttribute('data-pay');
  const p = plans.find(x => x.id === id);
  if(!p || !p.monthly) return;
  const total = Number(p.total)||0;
  const newPaid = Math.min((Number(p.paid)||0) + Number(p.monthly), total);
  p.paid = newPaid;
  p.history = p.history || [];
  p.history.push({date: new Date().toISOString().slice(0,10), amount: Number(p.monthly)});
  await savePlans();
  render();
  showToast('Paiement enregistré pour "' + p.name + '"');
}

function onEdit(e){
  const id = e.currentTarget.getAttribute('data-edit');
  const p = plans.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  document.getElementById('sheet-title').textContent = 'Modifier le plan';
  document.getElementById('f-name').value = p.name;
  document.getElementById('f-total').value = p.total;
  document.getElementById('f-paid').value = p.paid;
  document.getElementById('f-monthly').value = p.monthly || '';
  document.getElementById('f-dueday').value = p.dueDay || '';
  openSheet();
}

async function onDelete(e){
  const id = e.currentTarget.getAttribute('data-del');
  const p = plans.find(x => x.id === id);
  if(!p) return;
  if(!confirm('Supprimer "' + p.name + '" ? Cette action est définitive.')) return;
  plans = plans.filter(x => x.id !== id);
  await savePlans();
  render();
  showToast('Plan supprimé');
}

function openSheet(){
  document.getElementById('backdrop').classList.add('show');
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('show');
  editingId = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-total').value = '';
  document.getElementById('f-paid').value = '';
  document.getElementById('f-monthly').value = '';
  document.getElementById('f-dueday').value = '';
  document.getElementById('sheet-title').textContent = 'Nouveau plan de paiement';
}

document.getElementById('open-add').addEventListener('click', () => { editingId = null; openSheet(); });
document.getElementById('cancel-add').addEventListener('click', closeSheet);
document.getElementById('backdrop').addEventListener('click', (e) => { if(e.target.id === 'backdrop') closeSheet(); });

document.getElementById('save-add').addEventListener('click', async () => {
  const name = document.getElementById('f-name').value.trim();
  const total = parseFloat(document.getElementById('f-total').value);
  const paid = parseFloat(document.getElementById('f-paid').value) || 0;
  const monthly = parseFloat(document.getElementById('f-monthly').value) || 0;
  const dueDayRaw = parseInt(document.getElementById('f-dueday').value);
  const dueDay = (!isNaN(dueDayRaw) && dueDayRaw >= 1 && dueDayRaw <= 31) ? dueDayRaw : null;

  if(!name || isNaN(total) || total <= 0){
    showToast('Nom et montant total sont requis');
    return;
  }

  if(editingId){
    const p = plans.find(x => x.id === editingId);
    if(p){ p.name = name; p.total = total; p.paid = paid; p.monthly = monthly; p.dueDay = dueDay; }
  } else {
    plans.push({
      id: 'plan_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name, total, paid, monthly, dueDay, history: []
    });
  }
  await savePlans();
  render();
  closeSheet();
  showToast('Plan enregistré');
});

loadPlans();
</script>
</body>
</html>
